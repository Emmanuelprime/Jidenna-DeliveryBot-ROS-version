controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jidenna_ros_controller:
      type: diff_drive_controller/DiffDriveController


jidenna_ros_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    use_stamped_vel: false
    left_wheel_names:  [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    publish_rate: 50.0
    pose_covariance_diagonal:  [0.001, 0.001, 1.0e-3, 1.0e-3, 0.01, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e-3, 1.0e-3, 0.01, 0.01]

    wheel_radius: 0.0825
    wheel_separation: 0.521
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    wheel_separation_multiplier: 1.0
    cmd_vel_timeout: 0.5
    base_frame_id: base_link
    publish_limited_velocity: true
    publish_wheel_data: true
    enable_odom_tf: false           # <-- EKF publishes TF
    open_loop: true                 # <-- bypass feedback gating

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.8
        min_velocity: -0.8
        has_acceleration_limits: true
        max_acceleration: 1.5
        min_acceleration: -0.75
        has_jerk_limits: false
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        min_velocity: -3.0
        has_acceleration_limits: true
        max_acceleration: 1.57
        min_acceleration: -1.57
        has_jerk_limits: false